<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Empresa</title>
</head>

<body>

<h1>Editar Empresa</h1>

<form
        th:action="@{/admin/empresas/editar/{id}(id=${empresa.id})}"
        th:object="${empresa}"
        method="post">

    <div>

        <label for="nombre">
            Nombre de la empresa:
        </label>

        <input
                type="text"
                id="nombre"
                th:field="*{nombre}">

        <div
                th:if="${#fields.hasErrors('nombre')}"
                th:errors="*{nombre}">
        </div>

    </div>

    <br>

    <div>

        <label for="nit">
            NIT:
        </label>

        <input
                type="text"
                id="nit"
                th:field="*{nit}">

        <div
                th:if="${#fields.hasErrors('nit')}"
                th:errors="*{nit}">
        </div>

        <div
                th:if="${nitDuplicado}"
                th:text="${nitDuplicado}">
        </div>

    </div>

    <br>

    <div>

        <label for="telefono">
            Teléfono:
        </label>

        <input
                type="text"
                id="telefono"
                th:field="*{telefono}">

        <div
                th:if="${#fields.hasErrors('telefono')}"
                th:errors="*{telefono}">
        </div>

    </div>

    <br>

    <div>

        <label for="correo">
            Correo electrónico:
        </label>

        <input
                type="email"
                id="correo"
                th:field="*{correo}">

        <div
                th:if="${#fields.hasErrors('correo')}"
                th:errors="*{correo}">
        </div>

    </div>

    <br>

    <div>

        <label for="direccion">
            Dirección:
        </label>

        <input
                type="text"
                id="direccion"
                th:field="*{direccion}">

        <div
                th:if="${#fields.hasErrors('direccion')}"
                th:errors="*{direccion}">
        </div>

    </div>

    <br>

    <button type="submit">
        Guardar cambios
    </button>

</form>

<br>

<a th:href="@{/admin/empresas}">
    Cancelar
</a>

</body>

</html>
