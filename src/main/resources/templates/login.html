<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>
</head>

<body>

<h1>Inicio de Sesión</h1>

<form th:action="@{/login}" method="post">

    <div>

        <label for="correo">
            Correo electrónico:
        </label>

        <input
                type="email"
                id="correo"
                name="correo"
                required>

    </div>

    <br>

    <div>

        <label for="password">
            Contraseña:
        </label>

        <input
                type="password"
                id="password"
                name="password"
                required>

    </div>

    <br>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

<br>

<div
        th:if="${error}"
        th:text="${error}">
</div>

<div
        th:if="${mensaje}"
        th:text="${mensaje}">
</div>

<div th:if="${usuario}">

    <h2>Bienvenido</h2>

    <p>
        Nombre:
        <span th:text="${usuario.nombre}"></span>
    </p>

    <p>
        Apellido:
        <span th:text="${usuario.apellido}"></span>
    </p>

    <p>
        Rol:
        <span th:text="${usuario.rol}"></span>
    </p>

</div>

</body>

</html>
